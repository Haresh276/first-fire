<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="same-origin">
  <title>Account · FIRST FIRE</title>
  <link rel="icon" href="/icon.svg">
  <link rel="stylesheet" href="/account/account.css">
  <script defer src="/account/account.js"></script>
</head>
<body>
  <header>
    <a class="wordmark" href="/research-workspace/" aria-label="FIRST FIRE home">FIRST FIRE<span>.</span></a>
    <a href="/research-workspace/">Research workspace</a>
  </header>
  <main>
    <h1 id="heading">Sign in</h1>
    <p id="description">Choose an account to use with FIRST FIRE.</p>
    <p id="notice" role="status" aria-live="polite"></p>
    <div id="providers" class="actions" aria-label="Sign-in options">
      <button id="google" type="button" disabled>Continue with Google</button>
      <button id="github" type="button" disabled>Continue with GitHub</button>
    </div>
    <button id="signout" type="button" hidden>Sign out</button>
    <p id="status" role="status" aria-live="polite">Checking availability…</p>
    <button id="retry" type="button" hidden>Check again</button>
    <noscript><p>Enable JavaScript to sign in.</p></noscript>
    <a class="workspace" href="/research-workspace/">Back to research workspace</a>
  </main>
</body>
</html>
